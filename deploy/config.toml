# Configuration du service SegBrainMRI : copier dans /etc/segbrainmri/config.toml

[listener]
# Serveur DICOM de cette VM, qui reçoit les FLAIR envoyées par Orthanc
ae_title = "SEGBRAINMRI"
host = "0.0.0.0"
port = 11112
# AET autorisés à envoyer des images (vide = tout le monde)
allowed_calling_aets = ["ORTHANC"]

[orthanc]
# Destination des résultats (port DICOM d'Orthanc)
host = "192.168.10.172"
port = 4242
ae_title = "ORTHANC"

[processing]
spool_dir = "/var/lib/segbrainmri"
# Une série est traitée quand plus aucune image n'arrive depuis N secondes
settle_seconds = 20
device = "auto"          # auto | cpu | cuda | cuda:0
# threads = 8            # threads CPU PyTorch (défaut : automatique)
flair_patterns = ["flair", "dark[ _-]?fluid", "t2[ _-]?fl", "spcir"]
keep_inputs = false      # supprimer les images reçues après un traitement réussi

[model]
backend = "flames"
models_dir = "/opt/segbrainmri/models"
tta = "auto"             # augmentation au test : GPU seulement (8x plus lent sur CPU)
skull_strip = true

[output]
seg = true               # DICOM SEG (OHIF, Stone Web Viewer, 3D Slicer, Weasis)
contours = false         # series d'images (contours, couleur) : inutiles si le viewer affiche le SEG ;
                         # mettre true pour une visionneuse sans DICOM SEG (ex. Horos)
contour_thickness_mm = 0.8
sr = true                # compte rendu DICOM SR (resume, nouvelles lesions avec position)
overlay = false          # ancienne serie couleur (non fenetrable)
overlay_opacity = 0.5

[longitudinal]
# Cherche dans Orthanc la FLAIR anterieure du patient (meme PatientID, date anterieure)
# et signale les nouvelles lesions. Orthanc doit declarer la VM dans DicomModalities.
enabled = true
min_new_mm3 = 10         # taille minimale d'une nouvelle lesion signalee
tolerance_mm = 1.0       # marge de recalage : a moins de 1 mm d'une ancienne lesion = pas nouvelle
enlarge_ratio = 1.5      # lesion elargie si volume >= 1,5 x l'ancien...
enlarge_min_mm3 = 20     # ... et au moins 20 mm3 de plus

[volumetry]
# Volumetrie des T1 3D (FastSurfer) : lobes, hippocampes, ventricules... et percentiles
# selon l'age et le sexe (normes BrainCharts, non calibrees sur le scanner local).
enabled = true
t1_patterns = ["bravo", "mprage", "mp-rage", "spgr", "t1[ _-]?3d", "3d[ _-]?t1", "t1w[ _-]?3d", "3d[ _-]?tfe", "t1[ _-]?tfe"]
# T1 injectees ignorees (FastSurfer est entraine sur des T1 sans gadolinium)
t1_exclude = ["gado", '\bgd\b', '\bpost\b', '\+ ?c\b', "contrast", '\binj']
fastsurfer_dir = "/opt/segbrainmri/fastsurfer"
fastsurfer_python = "/opt/segbrainmri/fastsurfer-venv/bin/python"
norms_dir = "/opt/segbrainmri/models/norms"
