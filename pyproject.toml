[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segbrainmri"
version = "0.1.0"
description = "Segmentation des lésions de Sclérose en Plaques (SEP) sur IRM cérébrale (FLAIR/T1), CPU par défaut, CUDA si disponible."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["MRI", "multiple sclerosis", "segmentation", "PyTorch", "NIfTI"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "SimpleITK>=2.3",
    "nibabel>=5.0",
    "scipy>=1.10",
    # torch est installé séparément (roue CPU ou CUDA) : voir README.md
    "torch>=2.1",
    # Modèle FLAMeS (nnU-Net v2) et SynthStrip (surfa)
    "nnunetv2>=2.5",
    "surfa>=0.6",
    # DICOM
    "pydicom>=3.0",
    "pynetdicom>=2.1",
    "highdicom>=0.23",
]

[project.optional-dependencies]
monai = ["monai>=1.3"]
dev = ["pytest>=7.4", "pytest-cov", "ruff>=0.5"]

[project.scripts]
segbrainmri = "segbrainmri.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
